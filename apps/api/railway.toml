[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run db:generate && npm run build --workspace @kravient/api"

[deploy]
startCommand = "npm run start --workspace @kravient/api"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
